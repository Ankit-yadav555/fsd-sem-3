<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABES Engineering College</title>
    <style>
       /* Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Body */
body {
    font-family: Arial, Helvetica, sans-serif;
    background-color: #f4f4f4;
    color: #333;
    line-height: 1.6;
}

/* Header */
header {
    background-color: #003366;
    color: white;
    text-align: center;
    padding: 20px;
}

/* Navigation Bar */
nav {
    background-color: #00509e;
    padding: 12px;
    text-align: center;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 15px;
    font-weight: bold;
}

nav a:hover {
    color: yellow;
}

/* Main Content */
main {
    width: 80%;
    margin: 20px auto;
}

/* Sections */
section {
    background-color: white;
    margin-bottom: 20px;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

/* Headings */
h1, h2 {
    color: #003366;
    margin-bottom: 10px;
}

/* Paragraph */
p {
    margin-bottom: 10px;
}

/* Lists */
ul {
    margin-left: 20px;
}

li {
    margin-bottom: 8px;
}

/* Images */
img {
    width: 100%;
    max-width: 500px;
    display: block;
    margin: 15px auto;
    border-radius: 10px;
}

/* Buttons */
button {
    background-color: #003366;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background-color: #00509e;
}

/* Footer */
footer {
    background-color: #003366;
    color: white;
    text-align: center;
    padding: 15px;
    margin-top: 20px;
}
    </style>
</head>
<body>
    <header>
        <h1>ABES Engineering College</h1>
        <div class="top-bar">
            <button type="button">Login</button>
        </div>
    </header>
    <main>
        <a class="link-button" href="https://www.abes.ac.in/">Visit ABES Website</a>
        <img src="https://static.boostmytalent.com/img/univ/abes-engineering-college-ghaziabad-campus-admission.webp" alt="ABES Engineering College">
        <hr>
        <div class="section-buttons">
            <button type="button">SEC A</button>
            <button type="button">SEC B</button>
            <button type="button">SEC C</button>
        </div>
    </main>
</body>
</html>
